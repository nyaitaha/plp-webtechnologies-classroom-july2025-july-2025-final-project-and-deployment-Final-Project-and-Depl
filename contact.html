<!-- contact.html (Contact page) -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Streamix — Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">STREAMIX</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="movies.html">Movies</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="auth">
      <button class="btn small">Sign In</button>
    </div>
  </header>

  <main class="container">
    <section class="section contact-section">
      <h2 class="section-title">Get in touch</h2>
      <p>Questions? Feedback? Drop us a message.</p>

      <form id="contactForm" class="contact-form" novalidate>
        <label>
          Name
          <input type="text" name="name" required />
        </label>

        <label>
          Email
          <input type="email" name="email" required />
        </label>

        <label>
          Message
          <textarea name="message" rows="6" required></textarea>
        </label>

        <div class="form-actions">
          <button class="btn btn-primary" type="submit">Send Message</button>
          <button class="btn" type="reset">Reset</button>
        </div>

        <div id="formMsg" class="form-msg" aria-live="polite"></div>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year3"></span> Streamix. All rights reserved.</div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
