<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Streamix — Movies</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand">STREAMIX</div>
    <nav class="nav">
      <a href="index.html">Home</a>
      <a href="movies.html" class="active">Movies</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="auth">
      <button class="btn small">Sign In</button>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">All Movies</h2>
      <div class="grid" id="moviesGrid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div>© <span id="year2"></span> Streamix. All rights reserved.</div>
  </footer>

  <template id="movieCard">
    <div class="card">
      <img class="card-img" src="" alt="" />
    </div>
  </template>

  <div id="modal2" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" data-target="modal2">&times;</button>
      <div class="video-wrap" id="modalVideo2"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
